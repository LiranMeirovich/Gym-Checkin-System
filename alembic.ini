# Alembic: database migrations (decision 0003).
#
# Apply all migrations:   uv run alembic upgrade head
# Create a new one:       uv run alembic revision --autogenerate -m "add customers"
#
# There's no database URL here on purpose: migrations/env.py takes the path
# from the deployment config (GYM_DATABASE_PATH), the same file the apps use.
# Docs: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Files are named by date first, so the folder lists them in order:
# 2026_10_24-3f9c2a1b7d4e_add_customers.py
file_template = %%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s
truncate_slug_length = 40
# The "Create Date" written in each file.
timezone = UTC

[post_write_hooks]
# Lint and format each new migration file so it passes CI as generated.
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Logging when Alembic runs from the command line.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
