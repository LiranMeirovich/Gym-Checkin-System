<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
</head>
{# Logged-in pages pass csrf_token: HTMX then sends it on every request,
   and each plain form adds <input type="hidden" name="csrf_token">. #}
<body{% if csrf_token %} hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}>
  {% if staff %}
  <header>
    <span>{{ staff.display_name }} · {{ role_names[staff.role] }}</span>
    <form method="post" action="/lock">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">נעילה</button>
    </form>
  </header>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
  {% if lock_after_seconds %}
  <script>
    // Back to the lock screen when the server's idle timeout has passed.
    // Only requests count as activity (as on the server), so the timer
    // restarts on a page load or an HTMX request, not on mouse moves.
    (function () {
      var timer;
      function restart() {
        clearTimeout(timer);
        timer = setTimeout(function () { location.assign("/login"); },
                           {{ lock_after_seconds }} * 1000);
      }
      document.addEventListener("htmx:afterRequest", restart);
      restart();
    })();
  </script>
  {% endif %}
</body>
</html>
